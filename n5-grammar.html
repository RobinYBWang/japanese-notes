<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 文法總整理</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b;
    --accent:#c0392b; --accent2:#2e7d6b; --line:#e6e2d8;
    --jp:#1a3a5c; --done:#e8f5e9; --doneline:#bcdfc0; --shadow:0 1px 3px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
  header{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.96);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 20px}
  .htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0;color:var(--accent);letter-spacing:1px}
  .progwrap{flex:1;min-width:180px}
  .progbar{height:10px;background:#e6e2d8;border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,#2e7d6b,#56b39a);transition:width .4s}
  .progtxt{font-size:12px;color:var(--sub);margin-top:3px}
  .search{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--line);border-radius:22px;
    font-size:15px;background:#fff;outline:none}
  .search:focus{border-color:var(--accent2)}
  .filters{max-width:1100px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:5px 13px;border:1px solid var(--line);background:#fff;border-radius:18px;
    font-size:13px;cursor:pointer;color:var(--sub);user-select:none;transition:.15s}
  .chip:hover{border-color:var(--accent2)}
  .chip.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .resetbtn{margin-left:auto;padding:5px 13px;border:1px solid var(--accent);color:var(--accent);
    background:#fff;border-radius:18px;font-size:13px;cursor:pointer}
  /* 收合 */
  header.collapsed .filters{display:none}
  header.collapsed .progtxt{display:none}
  header.collapsed h1{font-size:16px}
  #togglebtn{transition:transform .2s}
  header.collapsed #togglebtn{transform:rotate(180deg)}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .sec{margin-bottom:34px;scroll-margin-top:120px}
  .sechead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--accent);
    padding-bottom:6px;margin-bottom:14px}
  .sechead h2{font-size:19px;margin:0;color:var(--accent)}
  .sechead .cnt{font-size:12px;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;
    margin-bottom:12px;box-shadow:var(--shadow);transition:.2s}
  .card.done{background:var(--done);border-color:var(--doneline)}
  .ctop{display:flex;align-items:flex-start;gap:11px}
  .chk{appearance:none;width:21px;height:21px;border:2px solid #bbb;border-radius:5px;
    cursor:pointer;flex-shrink:0;margin-top:3px;position:relative;transition:.15s}
  .chk:checked{background:var(--accent2);border-color:var(--accent2)}
  .chk:checked::after{content:"✓";color:#fff;position:absolute;top:-2px;left:3px;font-size:15px}
  .ctitle{flex:1}
  .ctitle .t{font-size:17px;font-weight:700}
  .ctitle .form{font-size:14px;color:var(--accent2);font-weight:600;margin-top:1px}
  .desc{margin:9px 0 4px;color:#333}
  .desc b{color:var(--accent)}
  .note{font-size:13.5px;color:var(--sub);background:#faf8f3;border-left:3px solid var(--line);
    padding:6px 11px;border-radius:0 6px 6px 0;margin:8px 0}
  .ex{margin:7px 0 0;padding-left:2px}
  .ex .row{padding:6px 0;border-top:1px dashed var(--line)}
  .ex .jp{color:var(--jp);font-size:16px;font-weight:600}
  .ex .zh{color:var(--sub);font-size:14px}
  table.conj{border-collapse:collapse;width:100%;margin:8px 0;font-size:14.5px}
  table.conj th,table.conj td{border:1px solid var(--line);padding:6px 9px;text-align:left}
  table.conj th{background:#f0ece2;color:var(--accent)}
  table.conj td .jp{color:var(--jp);font-weight:600}
  .noresult{text-align:center;color:var(--sub);padding:40px;display:none}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:30px;border-top:1px solid var(--line)}
  mark{background:#fff3a0;padding:0 1px}
  .spk{border:1px solid var(--line);background:#fff;border-radius:50%;width:27px;height:27px;min-width:27px;
    cursor:pointer;font-size:13px;flex-shrink:0;margin-top:2px;line-height:1;transition:.15s}
  .spk:hover{border-color:var(--accent2)}
  .spk.playing{background:var(--accent2);border-color:var(--accent2);animation:pulse .8s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .ex .row{display:flex;align-items:flex-start;gap:9px}
  .say{cursor:pointer}
  .say:hover{text-decoration:underline dotted var(--accent2)}
  .say.playing{color:var(--accent)}
  .voicebtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;
    font-size:17px;cursor:pointer;flex-shrink:0;transition:.15s}
  .voicebtn:hover{border-color:var(--accent2)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
    justify-content:center;z-index:100;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:12px;padding:18px;width:min(440px,94vw);display:flex;
    flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal h3{margin:0;color:var(--accent);font-size:17px}
  .vrow{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
  .vrow select,.vrow input{font-size:14px;max-width:100%}
  .mrow{display:flex;gap:8px;justify-content:flex-end}
  .mrow button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
  .mrow .btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .mhint{font-size:12px;color:var(--sub);line-height:1.6}
  @media(max-width:600px){
    h1{font-size:18px}.htop{gap:8px}body{font-size:15px}
    header{padding:10px 14px}
    header.collapsed{padding:7px 14px}
    .voicebtn{width:36px;height:36px;font-size:15px}
    .search{min-width:130px;padding:7px 12px;font-size:14px}
    .progwrap{min-width:120px}
    main{padding:14px}
  }
  .homelnk{font-size:13px;text-decoration:none;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:16px;padding:4px 11px;white-space:nowrap}
  .homelnk:hover{border-color:var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>N5 文法總整理</h1>
    <a class="homelnk" href="index.html" title="回到目錄首頁">🏠 首頁</a>
    <div class="progwrap">
      <div class="progbar"><div class="progfill" id="pf"></div></div>
      <div class="progtxt" id="pt">學習進度 0 / 0</div>
    </div>
    <input type="text" class="search" id="search" placeholder="🔍 搜尋文法（中文 / 日文 / 形式）...">
    <button class="voicebtn" id="voicebtn" title="語音設定">🔊</button>
    <button class="voicebtn" id="togglebtn" title="收合／展開分類列">▴</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div id="content"></div>
  <div class="noresult" id="noresult">找不到符合的文法 😅 試試其他關鍵字</div>
</main>
<footer>N5 文法總整理 · 勾選會自動儲存於此瀏覽器 · 持續學習，加油！💪</footer>

<div class="modal-bg" id="voicemodal">
  <div class="modal">
    <h3>🔊 語音設定</h3>
    <label class="vrow">語音<select id="voicesel"></select></label>
    <label class="vrow">語速 <span id="rateval">0.90×</span><input type="range" id="ratein" min="0.5" max="1.5" step="0.05"></label>
    <label class="vrow">音高 <span id="pitchval">1.00</span><input type="range" id="pitchin" min="0.5" max="1.5" step="0.05"></label>
    <div class="mrow"><button id="vtest">▶ 試聽</button><button class="btn-primary" id="vclose">關閉</button></div>
    <div class="mhint">點例句前的 🔊 或日文文字即可發音。設定會自動儲存。清單裡沒有日語語音的話，請到系統設定安裝日語語音包後重新開啟網頁。</div>
  </div>
</div>

<script>
/* ============ 資料 ============ */
const DATA = [
{
  cat:"基礎：名詞句", items:[
  {id:"n-desu", t:"〜です", form:"名詞 + です", desc:"最基本的肯定句，相當於中文「是」。<b>です</b>是禮貌體，放在句尾。",
   ex:[{jp:"わたしは 学生（がくせい）です。",zh:"我是學生。"},{jp:"これは 本（ほん）です。",zh:"這是書。"}]},
  {id:"n-janai", t:"〜ではありません", form:"名詞 + ではありません／じゃありません", desc:"名詞的<b>否定</b>。口語常用「じゃありません」。",
   ex:[{jp:"わたしは 先生（せんせい）ではありません。",zh:"我不是老師。"},{jp:"これは ペンじゃありません。",zh:"這不是筆。"}]},
  {id:"n-deshita", t:"〜でした／〜ではありませんでした", form:"名詞 + でした", desc:"名詞句的<b>過去式</b>。肯定用でした，否定用ではありませんでした。",
   ex:[{jp:"きのうは 雨（あめ）でした。",zh:"昨天是雨天。"},{jp:"テストは 簡単（かんたん）ではありませんでした。",zh:"考試不簡單。"}]},
  {id:"n-no", t:"AのB（の的用法）", form:"名詞 + の + 名詞", desc:"<b>の</b>連接兩個名詞，表所屬、所在、性質，相當於「的」。",
   ex:[{jp:"わたしの かばん。",zh:"我的包包。"},{jp:"日本語（にほんご）の 先生。",zh:"日語老師（教日語的老師）。"}]},
  ]
},
{
  cat:"指示詞（こそあど）", items:[
  {id:"kore", t:"これ・それ・あれ・どれ", form:"事物", desc:"指<b>事物</b>。これ=這個(近說話者)、それ=那個(近聽者)、あれ=那個(都遠)、どれ=哪個(疑問)。本身就是名詞。",
   ex:[{jp:"これは 何（なん）ですか。",zh:"這是什麼？"},{jp:"あれは わたしの 車（くるま）です。",zh:"那是我的車。"}]},
  {id:"kono", t:"この・その・あの・どの", form:"+ 名詞", desc:"指<b>後接名詞</b>。必須加名詞，不能單獨用。",
   ex:[{jp:"この 人（ひと）は だれですか。",zh:"這個人是誰？"},{jp:"その 本（ほん）を ください。",zh:"請給我那本書。"}]},
  {id:"koko", t:"ここ・そこ・あそこ・どこ", form:"場所", desc:"指<b>場所</b>。ここ=這裡、そこ=那裡、あそこ=那裡(遠)、どこ=哪裡。",
   ex:[{jp:"トイレは どこですか。",zh:"廁所在哪裡？"},{jp:"ここは 図書館（としょかん）です。",zh:"這裡是圖書館。"}]},
  {id:"konna", t:"こちら・そちら・あちら・どちら", form:"方向／禮貌", desc:"指<b>方向</b>，也是ここ等的禮貌說法；どちら也可問「哪一個（二選一）」。",
   ex:[{jp:"お国（くに）は どちらですか。",zh:"您是哪一國人？"},{jp:"こちらへ どうぞ。",zh:"請往這邊走。"}]},
  ]
},
{
  cat:"助詞", items:[
  {id:"p-wa", t:"は（主題）", form:"〜は", desc:"標示<b>主題</b>（讀作 wa）。「關於～」。最常見的助詞。",
   ex:[{jp:"わたしは 台湾人（たいわんじん）です。",zh:"我是台灣人。"}]},
  {id:"p-ga", t:"が（主格／焦點）", form:"〜が", desc:"標示<b>主語</b>或新資訊焦點；也用於描述存在、能力、喜好的對象。",
   ex:[{jp:"猫（ねこ）が います。",zh:"有貓。"},{jp:"日本語（にほんご）が 好（す）きです。",zh:"喜歡日語。"}]},
  {id:"p-wo", t:"を（受詞）", form:"〜を", desc:"標示動作的<b>對象（受詞）</b>（讀作 o）。也表移動經過、離開的場所。",
   ex:[{jp:"ごはんを 食（た）べます。",zh:"吃飯。"},{jp:"公園（こうえん）を 散歩（さんぽ）します。",zh:"在公園散步（經過）。"}]},
  {id:"p-ni", t:"に（時間／地點／對象）", form:"〜に", desc:"用途多：<b>時間點</b>、<b>存在地點</b>、<b>到達點</b>、<b>動作對象</b>。",
   ex:[{jp:"7時（しちじ）に 起（お）きます。",zh:"七點起床。"},{jp:"教室（きょうしつ）に います。",zh:"在教室裡。"},{jp:"友達（ともだち）に 会（あ）います。",zh:"和朋友見面。"}]},
  {id:"p-de", t:"で（場所／手段）", form:"〜で", desc:"表<b>動作發生的場所</b>，或<b>手段、工具、方法</b>。",
   ex:[{jp:"レストランで 食（た）べます。",zh:"在餐廳吃。"},{jp:"バスで 行（い）きます。",zh:"搭公車去。"}]},
  {id:"p-e", t:"へ（方向）", form:"〜へ", desc:"表<b>移動的方向</b>（讀作 e），常與に互換。",
   ex:[{jp:"学校（がっこう）へ 行（い）きます。",zh:"去學校。"}]},
  {id:"p-to", t:"と（和／一起）", form:"〜と", desc:"連接名詞「<b>和</b>」（全部列舉），或表「<b>和～一起</b>」。",
   ex:[{jp:"パンと 牛乳（ぎゅうにゅう）を 買（か）います。",zh:"買麵包和牛奶。"},{jp:"友達（ともだち）と 行（い）きます。",zh:"和朋友一起去。"}]},
  {id:"p-ya", t:"や（列舉一部分）", form:"〜や〜（など）", desc:"列舉時表「<b>～等等</b>」，只舉例其中幾個（と是全部）。常配など。",
   ex:[{jp:"机（つくえ）の 上（うえ）に 本（ほん）や ペンが あります。",zh:"桌上有書和筆等東西。"}]},
  {id:"p-mo", t:"も（也）", form:"〜も", desc:"表「<b>也</b>」，取代は/が/を。",
   ex:[{jp:"わたしも 行（い）きます。",zh:"我也去。"}]},
  {id:"p-no2", t:"の（疑問／省略名詞）", form:"〜の", desc:"口語疑問語氣（の？），或代替已知名詞「的（那個）」。",
   ex:[{jp:"これは だれの？",zh:"這是誰的？"},{jp:"赤（あか）いのが いいです。",zh:"紅色的比較好。"}]},
  {id:"p-kara", t:"から・まで（從～到～）", form:"〜から〜まで", desc:"表時間或空間的<b>起點から</b>、<b>終點まで</b>。",
   ex:[{jp:"9時（くじ）から 5時（ごじ）まで 働（はたら）きます。",zh:"從九點工作到五點。"}]},
  {id:"p-ka", t:"か（疑問）", form:"〜か", desc:"句尾加<b>か</b>變疑問句。",
   ex:[{jp:"あなたは 学生（がくせい）ですか。",zh:"你是學生嗎？"}]},
  {id:"p-ne-yo", t:"ね・よ（語氣）", form:"〜ね／〜よ", desc:"<b>ね</b>=尋求認同「對吧」；<b>よ</b>=告知對方新資訊「喔」。",
   ex:[{jp:"いい 天気（てんき）ですね。",zh:"天氣真好呢。"},{jp:"その 店（みせ）は 安（やす）いですよ。",zh:"那家店很便宜喔。"}]},
  ]
},
{
  cat:"疑問詞", items:[
  {id:"q-words", t:"基本疑問詞", form:"なに・だれ・どこ・いつ…", desc:"常用疑問詞整理，搭配「〜か」使用。",
   table:[["何（なに／なん）","什麼"],["誰（だれ）／どなた","誰／哪位(敬)"],["どこ","哪裡"],["いつ","什麼時候"],["どうして／なぜ","為什麼"],["どう／いかが","如何(いかが較敬)"],["いくら","多少錢"],["いくつ","幾個／幾歲"],["どれ／どの","哪個"],["どんな","什麼樣的"]],
   ex:[{jp:"これは いくらですか。",zh:"這個多少錢？"},{jp:"いつ 来（き）ますか。",zh:"什麼時候來？"}]},
  {id:"q-ka-mo", t:"疑問詞＋か／も", form:"だれか・なにも…", desc:"疑問詞＋<b>か</b>=某(不確定)；＋<b>も＋否定</b>=完全沒有。",
   ex:[{jp:"だれか いますか。",zh:"有人在嗎？"},{jp:"何（なに）も 食（た）べません。",zh:"什麼都不吃。"},{jp:"どこへも 行（い）きません。",zh:"哪裡都不去。"}]},
  ]
},
{
  cat:"存在：あります・います", items:[
  {id:"arimasu", t:"〜が あります／います", form:"場所に 物/人が あります/います", desc:"表<b>存在</b>。無生命用<b>あります</b>，有生命(人/動物)用<b>います</b>。",
   ex:[{jp:"机（つくえ）の 上（うえ）に 本（ほん）が あります。",zh:"桌上有書。"},{jp:"庭（にわ）に 犬（いぬ）が います。",zh:"院子裡有狗。"}]},
  {id:"basho", t:"位置名詞", form:"上・下・中・前…", desc:"表示相對位置，配「Aの＋位置＋に」。",
   table:[["上（うえ）","上面"],["下（した）","下面"],["中（なか）","裡面"],["外（そと）","外面"],["前（まえ）","前面"],["後（うし）ろ","後面"],["右（みぎ）","右邊"],["左（ひだり）","左邊"],["隣（となり）","隔壁"],["近（ちか）く","附近"],["間（あいだ）","之間"]],
   ex:[{jp:"銀行（ぎんこう）は 駅（えき）の 前（まえ）に あります。",zh:"銀行在車站前面。"}]},
  ]
},
{
  cat:"動詞分類", items:[
  {id:"v-groups", t:"三大動詞分類（總覽）", form:"I類・II類・III類", desc:"日語動詞天生就屬於某一類，<b>跟動作的意思無關，只看字尾的發音長相</b>。分類決定了後面所有變化（ます形・て形・ない形…）要用哪套規則，所以是動詞學習的第一步。<br><br><b>I類（五段動詞／グループ1）</b>：辭書形以う段音結尾（く・ぐ・す・つ・ぬ・ぶ・む・る・う），且不屬於II類。數量最多，約佔七成。<br><b>II類（一段動詞／グループ2）</b>：以<b>る</b>結尾，且る前面是<b>い段或え段</b>音。變化最單純，詞幹永遠不變。<br><b>III類（不規則動詞／グループ3）</b>：只有 <b>する</b>（做）和 <b>来る（くる）</b>（來）兩個，以及它們組成的複合動詞。",
   table:[["I類（五段）","書（か）く・飲（の）む・話（はな）す・買（か）う・待（ま）つ・遊（あそ）ぶ"],["II類（一段）","食（た）べる・見（み）る・寝（ね）る・起（お）きる・開（あ）ける"],["III類（不規則）","する・来（く）る"]],
   note:"為什麼要分類？因為變ます形時 I類要「う段→い段」、II類只要「去る」、III類直接背；差別很大，分錯就全錯。",
   ex:[{jp:"書（か）く → 書きます",zh:"I類：寫"},{jp:"食（た）べる → 食べます",zh:"II類：吃"},{jp:"する → します",zh:"III類：做"}]},

  {id:"v-judge", t:"如何判斷是哪一類？（三步驟）", form:"看字尾 → 看る前面 → 查例外", desc:"依序問自己三個問題就能判斷：<br><b>Step 1</b>：是 する 或 来る 嗎？→ 是的話就是<b>III類</b>。<br><b>Step 2</b>：字尾<b>不是る</b>嗎？（く・ぐ・す・つ・ぬ・ぶ・む・う）→ 一定是<b>I類</b>。<br><b>Step 3</b>：字尾是る，看<b>る前面那個音</b>——是「い段（i）或え段（e）」→ <b>II類</b>；是「あ・う・お段」→ <b>I類</b>。",
   table:[["る前是 a／u／o 段 → I類","作（つく）る・乗（の）る・降（ふ）る・売（う）る・取（と）る"],["る前是 i 段 → II類","起（お）きる・借（か）りる・浴（あ）びる・落（お）ちる"],["る前是 e 段 → II類","食（た）べる・開（あ）ける・教（おし）える・忘（わす）れる"]],
   note:"口訣：「る前面聽起來是 i 或 e，就去る；其他一律五段變化。」但有一小群例外要背，見下一張卡。",
   ex:[{jp:"作（つく）る → 作ります",zh:"る前是「く(u段)」→ I類"},{jp:"起（お）きる → 起きます",zh:"る前是「き(i段)」→ II類"}]},

  {id:"v-exceptions", t:"⚠ 必背例外動詞", form:"看似II類，其實是I類", desc:"這些動詞る前面是<b>い段或え段</b>，照規則應該是II類，但實際上是<b>I類</b>。數量不多，直接背起來，是N5、N4的常考陷阱。",
   table:[["帰（かえ）る","回去 → 帰ります（×帰えます）"],["入（はい）る","進入 → 入ります"],["走（はし）る","跑 → 走ります"],["知（し）る","知道 → 知ります"],["切（き）る","切 → 切ります"],["要（い）る","需要 → 要ります"],["減（へ）る","減少 → 減ります"],["すべる","滑 → すべります"],["ける","踢 → けります"],["しゃべる","聊天 → しゃべります"]],
   note:"辨別小技巧：帰る、入る、走る、知る、切る、要る 這六個最常出現，先背這六個就夠應付N5。",
   ex:[{jp:"うちへ 帰（かえ）ります。",zh:"回家。（不是「帰えます」）"},{jp:"部屋（へや）に 入（はい）ります。",zh:"進房間。"}]},

  {id:"v-list1", t:"常用I類動詞（依字尾整理）", form:"う段結尾", desc:"I類動詞依<b>字尾音</b>分組記，之後學て形/た形的音便會直接用到這個分組。",
   table:[["〜く","書（か）く寫・行（い）く去・聞（き）く聽・働（はたら）く工作・歩（ある）く走路・着（つ）く到達"],["〜ぐ","泳（およ）ぐ游泳・急（いそ）ぐ趕快・脱（ぬ）ぐ脫"],["〜す","話（はな）す說・貸（か）す借出・返（かえ）す歸還・出（だ）す拿出・押（お）す推"],["〜つ","待（ま）つ等・持（も）つ拿・立（た）つ站"],["〜ぬ","死（し）ぬ死（只有這一個）"],["〜ぶ","遊（あそ）ぶ玩・呼（よ）ぶ叫・飛（と）ぶ飛・選（えら）ぶ選"],["〜む","飲（の）む喝・読（よ）む讀・住（す）む住・休（やす）む休息・頼（たの）む拜託"],["〜う","買（か）う買・会（あ）う見面・言（い）う說・使（つか）う使用・歌（うた）う唱・手伝（てつだ）う幫忙"],["〜る（I類）","作（つく）る做・乗（の）る搭乘・売（う）る賣・取（と）る拿・降（ふ）る下(雨)・撮（と）る拍・分（わ）かる懂・終（お）わる結束"]],
   ex:[{jp:"毎日（まいにち）新聞（しんぶん）を 読（よ）みます。",zh:"每天看報紙。"},{jp:"友達（ともだち）に 会（あ）います。",zh:"和朋友見面。"},{jp:"バスに 乗（の）ります。",zh:"搭公車。"}]},

  {id:"v-list2", t:"常用II類動詞", form:"い段る／え段る", desc:"II類變化最簡單：<b>去掉る</b>就是詞幹，接什麼都直接黏上去。",
   table:[["い段＋る","見（み）る看・起（お）きる起床・借（か）りる借入・浴（あ）びる淋浴・落（お）ちる掉落・降（お）りる下車・できる會/能"],["え段＋る","食（た）べる吃・寝（ね）る睡・開（あ）ける打開・閉（し）める關・教（おし）える教・覚（おぼ）える記住・忘（わす）れる忘記・入（い）れる放入・出（で）る出去・見（み）せる給看・かける打(電話)・つける開(電器)・止（と）める停"]],
   note:"見る・寝る・出る 只有兩個音節，看起來很短，但一樣是II類：見ます、寝ます、出ます。",
   ex:[{jp:"7時（しちじ）に 起（お）きます。",zh:"七點起床。"},{jp:"窓（まど）を 開（あ）けます。",zh:"打開窗戶。"},{jp:"漢字（かんじ）を 覚（おぼ）えます。",zh:"記漢字。"}]},

  {id:"v-list3", t:"III類：する的複合動詞", form:"名詞 + する", desc:"「<b>名詞＋する</b>」可以造出大量動詞，全部照する的規則變化。這是III類數量看似很少、實際卻很常用的原因。",
   table:[["勉強（べんきょう）する","讀書 → 勉強します"],["仕事（しごと）する","工作 → 仕事します"],["買（か）い物（もの）する","購物 → 買い物します"],["結婚（けっこん）する","結婚 → 結婚します"],["電話（でんわ）する","打電話 → 電話します"],["旅行（りょこう）する","旅行 → 旅行します"],["練習（れんしゅう）する","練習 → 練習します"],["掃除（そうじ）する","打掃 → 掃除します"],["洗濯（せんたく）する","洗衣 → 洗濯します"],["散歩（さんぽ）する","散步 → 散歩します"],["連（つ）れて来（く）る","帶來 → 連れて来ます（来る系）"],["持（も）って来（く）る","帶來(物) → 持って来ます"]],
   note:"来る（くる）的漢字讀音會隨變化改變：来ます（き）・来ない（こ）・来る（く）・来れば（く）・来よう（こ）。這是它最麻煩的地方。",
   ex:[{jp:"図書館（としょかん）で 勉強（べんきょう）します。",zh:"在圖書館讀書。"},{jp:"友達（ともだち）に 電話（でんわ）しました。",zh:"打了電話給朋友。"}]},

  {id:"v-v15", t:"V1〜V5：五段變化的骨架", form:"あ・い・う・え・お", desc:"I類又叫<b>五段動詞</b>，因為字尾會在 <b>あ・い・う・え・お</b> 五個母音之間移動。V1〜V5 就是這五格的編號。以<b>書く</b>為例，字尾在 か・き・く・け・こ 之間跑：",
   table:[["V1（あ段）書か","接ない → 書かない（ない形）"],["V2（い段）書き","接ます → 書きます（ます形）"],["V3（う段）書く","原形／辭書形（本身就能用）"],["V4（え段）書け","接ば → 書けば（ば形）；單獨用是命令形"],["V5（お段）書こ","接う → 書こう（意向形）"]],
   note:"重要觀念：V1〜V5 不是完整的字，是五種「接頭」。真正的句子＝接頭＋後面掛的零件，而零件（ない・ます）自己還會再變時態，例如 書か＋なかった＝書かなかった。",
   ex:[{jp:"飲（の）まない・飲みます・飲む・飲めば・飲もう",zh:"I類「飲む」的V1〜V5"},{jp:"待（ま）たない・待ちます・待つ・待てば・待とう",zh:"I類「待つ」的V1〜V5"}]},

  {id:"v-full-1", t:"I類完整變化範例：書く", form:"全形一覽", desc:"把一個I類動詞的所有形排在一起看，最容易抓到規律。",
   table:[["原形（V3）","書（か）く 寫"],["ない形（V1）","書かない 不寫"],["ます形（V2）","書きます 寫（禮貌）"],["ば形（V4）","書けば 如果寫的話"],["意向形（V5）","書こう 寫吧"],["て形","書いて（音便：く→いて）"],["た形","書いた 寫了"],["過去否定","書かなかった 沒寫"],["命令形","書け 給我寫！（語氣強烈）"],["可能形","書ける 會寫／能寫（N4）"]],
   note:"て形/た形的音便是I類專屬的難點：く→いて、ぐ→いで、う/つ/る→って、ぬ/ぶ/む→んで、す→して。行く是唯一例外（→行って）。",
   ex:[{jp:"手紙（てがみ）を 書（か）きました。",zh:"寫了信。"},{jp:"名前（なまえ）を 書いてください。",zh:"請寫名字。"},{jp:"漢字（かんじ）で 書かなかった。",zh:"沒有用漢字寫。"}]},

  {id:"v-full-2", t:"II類完整變化範例：食べる", form:"全形一覽", desc:"II類最好記：<b>去掉る</b>之後，詞幹「食べ」永遠不變，直接接東西就好。",
   table:[["原形","食（た）べる 吃"],["ない形","食べない 不吃"],["ます形","食べます 吃（禮貌）"],["ば形","食べれば 如果吃的話"],["意向形","食べよう 吃吧"],["て形","食べて"],["た形","食べた 吃了"],["過去否定","食べなかった 沒吃"],["命令形","食べろ 給我吃！"],["可能形","食べられる 能吃（N4）"]],
   note:"對照I類就懂差別：I類要換字尾母音＋音便，II類只是「去る＋X」。所以遇到新動詞先判斷類別，II類幾乎不會錯。",
   ex:[{jp:"朝（あさ）ご飯（はん）を 食（た）べます。",zh:"吃早餐。"},{jp:"野菜（やさい）を 食べなければなりません。",zh:"必須吃蔬菜。"},{jp:"もう 食べた？",zh:"已經吃了嗎？"}]},

  {id:"v-full-3", t:"III類完整變化範例：する・来る", form:"全形一覽（背起來）", desc:"沒有規則可循，只能整組背。好消息是只有兩個字。",
   table:[["原形","する 做 ／ 来（く）る 來"],["ない形","しない ／ 来（こ）ない"],["ます形","します ／ 来（き）ます"],["ば形","すれば ／ 来（く）れば"],["意向形","しよう ／ 来（こ）よう"],["て形","して ／ 来（き）て"],["た形","した ／ 来（き）た"],["過去否定","しなかった ／ 来（こ）なかった"],["命令形","しろ ／ 来（こ）い"],["可能形","できる ／ 来（こ）られる（N4）"]],

  {id:"v-masu", t:"ます形（禮貌體）與時態", form:"動詞 + ます／ません", desc:"動詞的禮貌體，對外人、長輩、不熟的人講話時使用。<b>時態四格</b>全靠ます本身變化：",

   note:"ます形也是很多句型的接續點：ます去ます＋たい（想～）、＋ましょう（～吧）、＋ながら（一邊～）、＋やすい/にくい（容易／難～）。",

  {id:"v-masu-rule", t:"辭書形 → ます形 變化規則", form:"三類各一套", desc:"由原形變成ます形的規則。I類是「<b>う段→い段</b>」，也就是移到V2。",

   ex:[{jp:"話（はな）す → 話します",zh:"說"},{jp:"起（お）きる → 起きます",zh:"起床"},{jp:"手伝（てつだ）う → 手伝います",zh:"幫忙"}]},

  {id:"v-tense", t:"禮貌體 vs 普通體：同一件事兩種說法", form:"四格 × 兩種禮貌度", desc:"很多人搞混的關鍵：<b>原形・ない形・た形其實就是普通體的時態四格</b>，不是額外的東西，只是「不客氣版」的ます形。",
   table:[["現在肯定","書きます ＝ 書く（原形）"],["現在否定","書きません ＝ 書かない（ない形）"],["過去肯定","書きました ＝ 書いた（た形）"],["過去否定","書きませんでした ＝ 書かなかった"]],

  {id:"v-func", t:"有時態的形 vs 沒時態的形", form:"觀念整理", desc:"動詞的各種形分兩群，功能完全不同：<br><b>A 有時態</b>：ます形、原形、ない形、た形 → 表示現在/過去、肯定/否定。<br><b>B 無時態（功能形）</b>：て形、ば形、意向形 → 本身不表時間，只提供功能，時態由句尾決定。",
   table:[["て形","連接用：〜てください請、〜ています正在、〜てもいい可以、〜てから之後"],["ば形","假設：〜ば 如果～的話"],["意向形","意志/邀約：〜う/よう ～吧（＝ましょう的常體）"]],
   ex:[{jp:"押（お）せば、ドアが 開（あ）きます。",zh:"按的話門就會開。（ば形）"},{jp:"一緒（いっしょ）に 帰（かえ）ろう。",zh:"一起回去吧。（意向形）"},{jp:"本（ほん）を 読（よ）んで、寝（ね）ます。",zh:"看書然後睡覺。（て形）"}]},

/* ============ 渲染 ============ */
const content=document.getElementById('content');
const filters=document.getElementById('filters');
let allItems=[];

function slug(s){return 'sec-'+s.replace(/[^a-zA-Z0-9一-龥ぁ-んァ-ン]/g,'')}

DATA.forEach(group=>{
  const sec=document.createElement('section');
  sec.className='sec';sec.id=slug(group.cat);sec.dataset.cat=group.cat;
  const head=document.createElement('div');head.className='sechead';
  head.innerHTML=`<h2>${group.cat}</h2><span class="cnt"></span>`;
  sec.appendChild(head);
  group.items.forEach(it=>{
    allItems.push(it);
    const card=document.createElement('div');
    card.className='card';card.id=it.id;card.dataset.cat=group.cat;
    let html=`<div class="ctop">
      <input type="checkbox" class="chk" data-id="${it.id}">
      <div class="ctitle"><div class="t">${it.t}</div>${it.form?`<div class="form">${it.form}</div>`:''}</div>
    </div>`;
    if(it.desc) html+=`<div class="desc">${it.desc}</div>`;
    if(it.note) html+=`<div class="note">💡 ${it.note}</div>`;
    const kanaRe=/[ぁ-んァ-ヶー]/;
    if(it.table){
      html+=`<table class="conj"><tbody>`;
      it.table.forEach(r=>{html+=`<tr><th${kanaRe.test(r[0])?' class="say" title="點我發音"':''}>${r[0]}</th><td><span class="jp${kanaRe.test(r[1])?' say" title="點我發音':''}">${r[1]}</span></td></tr>`});
      html+=`</tbody></table>`;
    }
    if(it.ex){
      html+=`<div class="ex">`;
      it.ex.forEach(e=>{html+=`<div class="row"><button class="spk" title="發音">🔊</button><div><div class="jp say" title="點我發音">${e.jp}</div><div class="zh">${e.zh}</div></div></div>`});
      html+=`</div>`;
    }
    // 搜尋用文字
    let searchtext=(it.t+' '+(it.form||'')+' '+(it.desc||'')+' '+(it.note||''));
    if(it.ex)it.ex.forEach(e=>searchtext+=' '+e.jp+' '+e.zh);
    if(it.table)it.table.forEach(r=>searchtext+=' '+r[0]+' '+r[1]);
    card.dataset.search=searchtext.replace(/<[^>]+>/g,'').toLowerCase();
    card.innerHTML=html;
    sec.appendChild(card);
  });
  content.appendChild(sec);
  // 篩選 chip
  const chip=document.createElement('div');chip.className='chip';chip.dataset.cat=group.cat;chip.textContent=group.cat;
  filters.appendChild(chip);
});

// reset chip + 全部 chip
const allChip=document.createElement('div');allChip.className='chip active';allChip.dataset.cat='__all';allChip.textContent='全部';
filters.insertBefore(allChip,filters.firstChild);
const reset=document.createElement('button');reset.className='resetbtn';reset.textContent='清除進度';
filters.appendChild(reset);

/* ============ 進度（localStorage）============ */
const KEY='n5grammar_progress_v1';
function loadProg(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function saveProg(p){localStorage.setItem(KEY,JSON.stringify(p))}
let prog=loadProg();

function updateProgUI(){
  const total=allItems.length;
  const done=Object.values(prog).filter(Boolean).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pt').textContent=`學習進度 ${done} / ${total}（${pct}%）`;
  // 各分類計數
  document.querySelectorAll('.sec').forEach(sec=>{
    const cards=sec.querySelectorAll('.card');
    let d=0;cards.forEach(c=>{if(prog[c.id])d++});
    sec.querySelector('.cnt').textContent=`${d}/${cards.length}`;
  });
}

document.querySelectorAll('.chk').forEach(chk=>{
  const id=chk.dataset.id;
  if(prog[id]){chk.checked=true;chk.closest('.card').classList.add('done')}
  chk.addEventListener('change',()=>{
    prog[id]=chk.checked;saveProg(prog);
    chk.closest('.card').classList.toggle('done',chk.checked);
    updateProgUI();
  });
});
updateProgUI();

reset.addEventListener('click',()=>{
  if(confirm('確定要清除所有學習進度嗎？')){
    prog={};saveProg(prog);
    document.querySelectorAll('.chk').forEach(c=>{c.checked=false;c.closest('.card').classList.remove('done')});
    updateProgUI();
  }
});

/* ============ 搜尋 ============ */
const search=document.getElementById('search');
const noresult=document.getElementById('noresult');
let activeCat='__all';

function applyFilter(){
  const q=search.value.trim().toLowerCase();
  let visible=0;
  document.querySelectorAll('.card').forEach(card=>{
    const matchCat=(activeCat==='__all'||card.dataset.cat===activeCat);
    const matchQ=(!q||card.dataset.search.includes(q));
    const show=matchCat&&matchQ;
    card.style.display=show?'':'none';
    if(show)visible++;
  });
  document.querySelectorAll('.sec').forEach(sec=>{
    const any=[...sec.querySelectorAll('.card')].some(c=>c.style.display!=='none');
    sec.style.display=any?'':'none';
  });
  noresult.style.display=visible?'none':'block';
}
search.addEventListener('input',applyFilter);

filters.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeCat=chip.dataset.cat;applyFilter();
  // 手機：選完分類自動收合，讓內容區露出來
  if(window.innerWidth<=600)setHeader(true);
});

/* ============ 標題列收合 ============ */
const hdr=document.querySelector('header');
const HKEY='n5_header_collapsed';
function setHeader(collapsed){
  hdr.classList.toggle('collapsed',collapsed);
  localStorage.setItem(HKEY,collapsed?'1':'0');
}
(function initHeader(){
  const saved=localStorage.getItem(HKEY);
  setHeader(saved===null?window.innerWidth<=600:saved==='1');
})();
document.getElementById('togglebtn').addEventListener('click',()=>setHeader(!hdr.classList.contains('collapsed')));

let ttsCfg={voice:'',rate:0.9,pitch:1};
try{ttsCfg=Object.assign(ttsCfg,JSON.parse(localStorage.getItem(TKEY)||'{}'))}catch(e){}
function saveTts(){localStorage.setItem(TKEY,JSON.stringify(ttsCfg))}
function jaVoices(){return ('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ja')):[]}
function cleanSay(t){return (t||'').replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').replace(/[～〜~※]/g,' ').trim()}
function speak(text,el){
  text=cleanSay(text);if(!text)return;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援語音朗讀，建議改用 Chrome、Edge 或 Safari。');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=+ttsCfg.rate||0.9;u.pitch=+ttsCfg.pitch||1;
  const vs=jaVoices();const v=vs.find(x=>x.name===ttsCfg.voice)||vs[0];if(v)u.voice=v;
  if(el){u.onstart=()=>el.classList.add('playing');u.onend=u.onerror=()=>el.classList.remove('playing')}
  speechSynthesis.speak(u);
}
content.addEventListener('click',e=>{
  const b=e.target.closest('.spk');
  if(b){const jp=b.parentElement.querySelector('.jp');if(jp)speak(jp.textContent,b);return;}
  const s=e.target.closest('.say');
  if(s)speak(s.textContent,s);
});

/* 語音設定視窗 */
const vmodal=document.getElementById('voicemodal');
function populateVoices(){
  const sel=document.getElementById('voicesel');const vs=jaVoices();
  sel.innerHTML=vs.length?vs.map(v=>`<option value="${v.name.replace(/"/g,'')}">${v.name}（${v.lang}）</option>`).join(''):'<option value="">（系統沒有日語語音，請安裝日語語音包）</option>';
  if(ttsCfg.voice&&vs.some(v=>v.name===ttsCfg.voice))sel.value=ttsCfg.voice;
  else if(vs.length&&!ttsCfg.voice)ttsCfg.voice=vs[0].name;
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=populateVoices;}
document.getElementById('voicebtn').addEventListener('click',()=>{
  populateVoices();
  document.getElementById('ratein').value=ttsCfg.rate;
  document.getElementById('rateval').textContent=(+ttsCfg.rate).toFixed(2)+'×';
  document.getElementById('pitchin').value=ttsCfg.pitch;
  document.getElementById('pitchval').textContent=(+ttsCfg.pitch).toFixed(2);
  vmodal.classList.add('show');
});
document.getElementById('voicesel').addEventListener('change',function(){ttsCfg.voice=this.value;saveTts()});
document.getElementById('ratein').addEventListener('input',function(){ttsCfg.rate=+this.value;document.getElementById('rateval').textContent=ttsCfg.rate.toFixed(2)+'×';saveTts()});
document.getElementById('pitchin').addEventListener('input',function(){ttsCfg.pitch=+this.value;document.getElementById('pitchval').textContent=ttsCfg.pitch.toFixed(2);saveTts()});
document.getElementById('vtest').addEventListener('click',()=>speak('こんにちは。日本語の練習を始めましょう。'));
document.getElementById('vclose').addEventListener('click',()=>vmodal.classList.remove('show'));
vmodal.addEventListener('click',e=>{if(e.target===vmodal)vmodal.classList.remove('show')});
</script>
</body>
</html>
